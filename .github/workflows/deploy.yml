# Netlify 正式部署(手动触发)
# 开发阶段已停用 push 自动部署;
# 需要上线时:恢复 on.push 配置,或本地执行 npm run build && netlify deploy --prod --dir dist
name: Deploy to Netlify

on:
  workflow_dispatch: # 仅手动触发(GitHub 页面 / gh workflow run)

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify (production)
        run: npx netlify-cli@latest deploy --prod --dir dist --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
